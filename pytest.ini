[pytest]
# Путь к корню проекта для импортов
pythonpath = .

# Паттерны для поиска тестов
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Минимальная версия Python
minversion = 7.0

# Опции по умолчанию
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes

# Маркеры для группировки тестов
markers =
    unit: Юнит-тесты для отдельных функций
    integration: Интеграционные тесты для флоу
    slow: Медленные тесты (например, с реальными API вызовами)
    fast: Быстрые тесты (без внешних зависимостей)

# Папки для поиска тестов
testpaths = tests
